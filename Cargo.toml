[package]
name = "ProjectGenesis"
version = "0.2.0"
edition = "2024"

[dependencies]
bincode = "1.3.3"
eframe = "0.37.0"
# The same epaint that eframe uses, with the feature that rasterises colour
# glyphs (`COLR`/`CPAL`): the atlas bundles one colour emoji face so every
# pictogram in the interface is drawn in one style, whatever the desktop's own
# emoji font looks like. See `assets/fonts/README.md`.
epaint = { version = "0.37.0", default-features = false, features = ["color_fonts"] }
image = "0.25.10"
noise = "0.9.0"
rand = "0.10.3"
rand_chacha = "0.10.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
zstd = { version = "0.14", features = ["zstdmt"] }
